name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Unit, property and integration tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: Bytecode compile
        env:
          PYTHONPATH: src
        run: python -m compileall -q src tests tools
      - name: Verify sealed evidence manifest
        env:
          PYTHONPATH: src
        run: python -m identity_invariants.reports.render --verify-only evidence/manifest.json
